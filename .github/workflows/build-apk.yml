name: Build & Release APK

on:
  push:
    branches: [main]
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Release version (e.g. 1.0.0)'
        required: false
        default: '1.0.0'

jobs:
  build-apk:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Install dependencies
        run: pnpm install --no-frozen-lockfile

      - name: Build web app
        run: pnpm --filter @workspace/earnflow run build

      - name: Install Capacitor CLI
        run: pnpm --filter @workspace/earnflow add -D @capacitor/cli @capacitor/core @capacitor/android

      - name: Add Android platform
        working-directory: artifacts/earnflow
        run: |
          npx cap add android || true
          npx cap sync android

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Generate keystore
        working-directory: artifacts/earnflow/android
        run: |
          keytool -genkey -v \
            -keystore bringwar.keystore \
            -alias bringwar \
            -keyalg RSA \
            -keysize 2048 \
            -validity 10000 \
            -storepass bringwar123 \
            -keypass bringwar123 \
            -dname "CN=BRINGWAR, OU=Gaming, O=DPHMS, L=US, S=US, C=US" 2>/dev/null || true

      - name: Build debug APK
        working-directory: artifacts/earnflow/android
        run: ./gradlew assembleDebug --no-daemon

      - name: Build release APK
        working-directory: artifacts/earnflow/android
        run: |
          ./gradlew assembleRelease \
            -Pandroid.injected.signing.store.file=bringwar.keystore \
            -Pandroid.injected.signing.store.password=bringwar123 \
            -Pandroid.injected.signing.key.alias=bringwar \
            -Pandroid.injected.signing.key.password=bringwar123 \
            --no-daemon

      - name: Find APK files
        id: find_apk
        run: |
          DEBUG_APK=$(find artifacts/earnflow/android -name "*debug*.apk" | head -1)
          RELEASE_APK=$(find artifacts/earnflow/android -name "*release*.apk" | head -1)
          echo "debug_apk=$DEBUG_APK" >> $GITHUB_OUTPUT
          echo "release_apk=$RELEASE_APK" >> $GITHUB_OUTPUT
          echo "Debug APK: $DEBUG_APK"
          echo "Release APK: $RELEASE_APK"

      - name: Rename APKs
        run: |
          VERSION=${{ github.event.inputs.version || '1.0.0' }}
          cp "${{ steps.find_apk.outputs.debug_apk }}" "BRINGWAR-Gaming-Rewards-v${VERSION}-debug.apk" 2>/dev/null || true
          cp "${{ steps.find_apk.outputs.release_apk }}" "BRINGWAR-Gaming-Rewards-v${VERSION}-release.apk" 2>/dev/null || true

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/') || github.event_name == 'workflow_dispatch'
        with:
          tag_name: v${{ github.event.inputs.version || '1.0.0' }}
          name: BRINGWAR Gaming Rewards v${{ github.event.inputs.version || '1.0.0' }}
          body: |
            ## BRINGWAR Gaming Rewards

            ### Installation
            1. Download the APK file below
            2. On your Android device, go to **Settings → Security → Unknown Sources** and enable it
            3. Open the downloaded APK and install

            ### Files
            - **release APK** — For distribution (signed)
            - **debug APK** — For testing

            Built automatically from the latest code.
          files: |
            BRINGWAR-Gaming-Rewards-*.apk
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload APK as artifact (on every push)
        uses: actions/upload-artifact@v4
        with:
          name: BRINGWAR-APK
          path: BRINGWAR-Gaming-Rewards-*.apk
          retention-days: 30
