name: Build & Release APK

on:
  push:
    branches: [main]
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Release version (e.g. 1.0.0)'
        required: false
        default: '1.0.0'

jobs:
  build-apk:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Install dependencies
        run: pnpm install --no-frozen-lockfile

      - name: Build web app
        run: pnpm --filter @workspace/earnflow run build
        env:
          PORT: "3000"
          BASE_PATH: "/"

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Add Android platform
        working-directory: artifacts/earnflow
        run: |
          npx cap add android 2>/dev/null || true
          npx cap sync android

      - name: Grant Gradle execute permission
        working-directory: artifacts/earnflow/android
        run: chmod +x gradlew

      - name: Generate keystore
        working-directory: artifacts/earnflow/android
        run: |
          keytool -genkey -v \
            -keystore bringwar.keystore \
            -alias bringwar \
            -keyalg RSA \
            -keysize 2048 \
            -validity 10000 \
            -storepass bringwar123 \
            -keypass bringwar123 \
            -dname "CN=BRINGWAR Gaming Rewards, OU=Gaming, O=DPHMS, L=US, S=US, C=US"

      - name: Build release APK
        working-directory: artifacts/earnflow/android
        run: |
          ./gradlew assembleRelease \
            -Pandroid.injected.signing.store.file=bringwar.keystore \
            -Pandroid.injected.signing.store.password=bringwar123 \
            -Pandroid.injected.signing.key.alias=bringwar \
            -Pandroid.injected.signing.key.password=bringwar123 \
            --no-daemon

      - name: Build debug APK
        working-directory: artifacts/earnflow/android
        run: ./gradlew assembleDebug --no-daemon

      - name: Collect and rename APKs
        run: |
          VERSION=${{ github.event.inputs.version || '1.0.0' }}
          mkdir -p release-apks
          find artifacts/earnflow/android -name "*release*.apk" -exec cp {} "release-apks/BRINGWAR-Gaming-Rewards-v${VERSION}.apk" \;
          find artifacts/earnflow/android -name "*debug*.apk" -exec cp {} "release-apks/BRINGWAR-Gaming-Rewards-v${VERSION}-debug.apk" \;
          ls -la release-apks/

      - name: Upload APK as artifact (every run)
        uses: actions/upload-artifact@v4
        with:
          name: BRINGWAR-APK-v${{ github.event.inputs.version || '1.0.0' }}
          path: release-apks/*.apk
          retention-days: 30

      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/') || github.event_name == 'workflow_dispatch'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ github.event.inputs.version || '1.0.0' }}
          name: BRINGWAR Gaming Rewards v${{ github.event.inputs.version || '1.0.0' }}
          body: |
            ## BRINGWAR Gaming Rewards APK

            **Created by DPHMS**

            ### How to install on Android:
            1. Download `BRINGWAR-Gaming-Rewards-v*.apk` below
            2. On your Android phone: **Settings → Security → Install unknown apps** → enable for your browser/file manager
            3. Open the downloaded APK file and tap **Install**

            > The debug APK is for testing only. Use the release APK for distribution.
          files: release-apks/*.apk
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
